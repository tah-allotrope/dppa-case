name: app-quality
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  # PHASE-05 TASK-05-02: one-time bootstrap to generate Linux visual-regression
  # baselines (Playwright suffixes snapshots by OS; Windows-generated
  # `-win32.png` baselines are not valid for this Linux CI runner). Human-only
  # step (H6 in plans/2026-october-readiness-checklist.md): trigger this job
  # from the Actions tab, download the `visual-baselines` artifact, commit its
  # `*-linux.png` files into `app/e2e/visual.spec.js-snapshots/`, then delete
  # this job and remove `continue-on-error` from the `quality` job's
  # `e2e:visual` step, all in the same commit.
  visual-bootstrap:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:visual -- --update-snapshots
      - uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: app/e2e/visual.spec.js-snapshots/
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      # npm ci previously failed here on optional-native-binary lockfile drift
      # (@emnapi/core missing) caused by a local/CI npm-version mismatch when the
      # lockfile was last regenerated; npm install is more tolerant of this class
      # of platform-optional-dependency resolution difference.
      - run: npm install
      - run: npm run lint
      - run: npx prettier --check src e2e scripts
      - run: npm run i18n:check
      - run: npm test
      - run: npm run coverage
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run e2e
      # No Linux baselines are committed yet (see app/deployment.md "Visual baseline
      # bootstrap"); this step is non-blocking until the first CI-generated set lands.
      - run: npm run e2e:visual
        continue-on-error: true
      - run: npm run build
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/playwright-report
  deck-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install app deps
        working-directory: app
        run: npm install
      - name: Regenerate spine + sweep from the settlement engine
        working-directory: app
        run: |
          node scripts/export-spine.mjs
          node scripts/export-sweep.mjs
      - name: Fail if the committed exports drifted from the engine
        run: git diff --exit-code assets/teaching/spine-s1.json assets/teaching/spine-s2.json assets/teaching/spine-s3.json assets/teaching/gate-sweep.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install python-pptx
      - run: python audit_teaching_deck.py
      - run: python verify_deck_numbers.py
      - run: python tools/check_retired_figures.py
      - run: python tools/verify_prose_figures.py
      - run: python tools/check_terminology_numbers.py
      - run: python -m unittest discover -s tools/tests -v
  # Q-001 fallback: Firebase deployment intentionally disabled until credentials exist.
